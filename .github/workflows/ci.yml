name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      plugins: ${{ steps.filter.outputs.plugins }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'cmd/**'
              - 'scripts/**'
            python:
              - 'analyzer/**'
            plugins:
              - 'plugins/**'
            config:
              - 'configs/**'

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod download

      - name: Setup Chrome for screenshot tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Export Chrome path
        run: echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Verify Chrome setup
        run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}"
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version

      - name: Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60
          args: --timeout=5m
        continue-on-error: true # Don't block entirely if linter has minor issues, but report them

      - name: Test
        run: go test ./...

      - name: Build CLI binary
        run: go build -o ./bin/spectre ./cmd/spectre

      - name: Startup performance benchmark
        run: |
          go run ./scripts/startup_perf -binary ./bin/spectre -runs 20 -json-out startup_perf.json

      - name: Upload startup benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: startup-performance
          path: startup_perf.json

      - name: Coverage gate
        run: |
          go test -coverprofile=coverage.out ./...
          go run ./scripts/check_coverage.go -profile coverage.out -min 40

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: go
          fail_ci_if_error: false

  python-checks:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analyzer/requirements.txt pytest-cov black flake8

      - name: Run Black formatter check
        run: black --check analyzer/

      - name: Run Flake8 linter
        run: flake8 analyzer/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest
        run: pytest analyzer/ --cov=analyzer --cov-report=xml

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  plugin-checks:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.plugins == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate Plugin Manifests
        run: python scripts/validate_plugins.py

  config-validation:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.config == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate Configurations
        run: python scripts/validate_configs.py