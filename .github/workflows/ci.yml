name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod download

      - name: Install Chromium for screenshot tests
        run: |
          sudo apt-get update
          browser=""
          for package in chromium-browser chromium; do
            if sudo apt-get install -y "$package"; then
              browser="$(command -v "$package")"
              break
            fi
          done

          if [ -z "$browser" ]; then
            echo "Failed to install Chromium" >&2
            exit 1
          fi

          echo "CHROME_BIN=$browser" >> "$GITHUB_ENV"
          echo "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true" >> "$GITHUB_ENV"
          echo "CI=true" >> "$GITHUB_ENV"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Coverage gate
        run: |
          go test -coverprofile=coverage.out ./...
          go run ./scripts/check_coverage.go -profile coverage.out -min 40